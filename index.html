<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #2a1744;
    --bg-2: #3d2160;
    --pink: #ff5d8f;
    --yellow: #ffd23f;
    --mint: #3ddcc5;
    --cream: #fff7ec;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    font-family: "Nunito", system-ui, sans-serif;
    color: var(--cream);
    background: radial-gradient(120% 90% at 50% 0%, var(--bg-2), var(--bg) 70%);
    min-height: 100svh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: max(20px, env(safe-area-inset-top)) 20px max(20px, env(safe-area-inset-bottom));
    overflow-x: hidden;
  }
  #confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }

  main { width: 100%; max-width: 480px; text-align: center; position: relative; z-index: 2; }

  /* Cake */
  .cake { width: 200px; height: 190px; margin: 0 auto 8px; position: relative; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .cake:focus-visible { outline: 3px solid var(--yellow); outline-offset: 8px; border-radius: 16px; }
  .tier { position: absolute; left: 50%; transform: translateX(-50%); border-radius: 14px 14px 10px 10px; }
  .t1 { bottom: 0; width: 200px; height: 62px; background: var(--pink); }
  .t2 { bottom: 62px; width: 150px; height: 52px; background: var(--mint); }
  .t3 { bottom: 114px; width: 100px; height: 40px; background: var(--yellow); }
  .tier::after { content: ""; position: absolute; left: 8%; right: 8%; top: 10px; height: 8px; border-radius: 8px; background: rgba(255,255,255,.55); }
  .candle { position: absolute; bottom: 154px; left: 50%; width: 10px; height: 30px; margin-left: -5px; background: var(--cream); border-radius: 3px; }
  .flame {
    position: absolute; left: 50%; bottom: 182px; width: 18px; height: 28px; margin-left: -9px;
    background: radial-gradient(circle at 50% 70%, #fff6c8, var(--yellow) 55%, #ff8a3d);
    border-radius: 50% 50% 50% 50% / 62% 62% 38% 38%;
    transform-origin: 50% 100%;
    animation: flicker .5s ease-in-out infinite alternate;
    box-shadow: 0 0 24px 8px rgba(255,210,63,.45);
    transition: opacity .3s, transform .3s;
  }
  .out .flame { opacity: 0; transform: scale(.2); animation: none; }
  @keyframes flicker { from { transform: scale(1) rotate(-3deg); } to { transform: scale(1.08, .94) rotate(3deg); } }

  h1 {
    font-family: "Fredoka", system-ui, sans-serif;
    font-weight: 700;
    font-size: clamp(2.4rem, 12vw, 3.6rem);
    line-height: 1.05;
    margin: 18px 0 6px;
    letter-spacing: -0.01em;
  }
  .name { color: var(--yellow); display: block; }
  .hint { opacity: .8; font-size: 1rem; min-height: 1.5em; }

  .card {
    margin: 22px auto 0;
    padding: 22px 22px 20px;
    background: rgba(255,247,236,.08);
    border: 1.5px solid rgba(255,247,236,.2);
    border-radius: 22px;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    opacity: 0; transform: translateY(14px) scale(.98);
    pointer-events: none;
    transition: opacity .6s ease, transform .6s ease;
  }
  .revealed .card { opacity: 1; transform: none; pointer-events: auto; }
  .card p { font-size: 1.08rem; line-height: 1.6; }
  .card .from { margin-top: 12px; font-family: "Fredoka", sans-serif; font-weight: 500; color: var(--mint); }

  button {
    margin-top: 16px;
    font: 600 1rem "Nunito", sans-serif;
    color: var(--bg);
    background: var(--yellow);
    border: 0; border-radius: 999px;
    padding: 14px 26px;
    min-height: 48px;
    cursor: pointer;
    touch-action: manipulation;
  }
  button:active { transform: scale(.97); }
  button:focus-visible { outline: 3px solid var(--cream); outline-offset: 3px; }

  @media (prefers-reduced-motion: reduce) {
    .flame { animation: none; }
    .card { transition: none; }
  }
</style>
</head>
<body>
<canvas id="confetti" aria-hidden="true"></canvas>

<main id="app">
  <div class="cake" id="cake" role="button" tabindex="0" aria-label="Blow out the candle">
    <div class="flame"></div>
    <div class="candle"></div>
    <div class="tier t3"></div>
    <div class="tier t2"></div>
    <div class="tier t1"></div>
  </div>

  <h1>Happy Birthday<span class="name" id="name">Friend!</span></h1>
  <p class="hint" id="hint">Tap the cake to blow out the candle</p>

  <section class="card" aria-live="polite">
    <p id="message">Wishing you a day full of laughter, good food, and people who love you. May this year bring you everything you’ve been hoping for.</p>
    <p class="from" id="from">With love</p>
    <button id="again" type="button">More confetti</button>
  </section>
</main>

<script>
  // ---- Customize here (or use the link: birthday.html?name=Riya&from=Aman) ----
  const CONFIG = {
    name: "Friend",
    from: "With love",
    message: "Wishing you a day full of laughter, good food, and people who love you. May this year bring you everything you’ve been hoping for."
  };

  const params = new URLSearchParams(location.search);
  const name = params.get("name") || CONFIG.name;
  const from = params.get("from");
  document.getElementById("name").textContent = name + "!";
  document.getElementById("message").textContent = params.get("msg") || CONFIG.message;
  document.getElementById("from").textContent = from ? "With love, " + from : CONFIG.from;
  document.title = "Happy Birthday, " + name + "!";

  // ---- Confetti ----
  const canvas = document.getElementById("confetti");
  const ctx = canvas.getContext("2d");
  const colors = ["#ff5d8f", "#ffd23f", "#3ddcc5", "#fff7ec", "#8f7cff"];
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
  let W, H, DPR, pieces = [], running = false;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  addEventListener("resize", resize);
  resize();

  function piece(x, y, vx, vy) {
    return {
      x, y, vx, vy,
      w: 6 + Math.random() * 7, h: 9 + Math.random() * 9,
      rot: Math.random() * Math.PI * 2, vr: (Math.random() - .5) * .3,
      color: colors[Math.floor(Math.random() * colors.length)],
      round: Math.random() < .25,
      tilt: Math.random() * Math.PI * 2
    };
  }

  function burst(x, y, count) {
    if (reduceMotion) count = Math.floor(count / 4);
    for (let i = 0; i < count; i++) {
      const a = Math.random() * Math.PI * 2;
      const s = 4 + Math.random() * 9;
      pieces.push(piece(x, y, Math.cos(a) * s, Math.sin(a) * s - 5));
    }
    start();
  }

  function rain(count) {
    if (reduceMotion) return;
    for (let i = 0; i < count; i++) {
      pieces.push(piece(Math.random() * W, -20 - Math.random() * H * .5, (Math.random() - .5) * 2, 2 + Math.random() * 3));
    }
    start();
  }

  function start() { if (!running) { running = true; requestAnimationFrame(tick); } }

  function tick() {
    ctx.clearRect(0, 0, W, H);
    for (const p of pieces) {
      p.vy += .18;
      p.vx *= .99;
      p.vy *= .99;
      p.x += p.vx;
      p.y += p.vy;
      p.rot += p.vr;
      p.tilt += .08;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      const squash = Math.abs(Math.cos(p.tilt));
      if (p.round) { ctx.beginPath(); ctx.ellipse(0, 0, p.w / 2, p.w / 2 * squash + .5, 0, 0, 7); ctx.fill(); }
      else ctx.fillRect(-p.w / 2, -p.h / 2 * squash, p.w, p.h * squash + 1);
      ctx.restore();
    }
    pieces = pieces.filter(p => p.y < H + 30);
    if (pieces.length) requestAnimationFrame(tick);
    else { running = false; ctx.clearRect(0, 0, W, H); }
  }

  // ---- Interaction ----
  const app = document.getElementById("app");
  const cake = document.getElementById("cake");
  const hint = document.getElementById("hint");

  function flamePos() {
    const r = cake.getBoundingClientRect();
    return { x: r.left + r.width / 2, y: r.top + 12 };
  }

  function blowOut() {
    if (app.classList.contains("out")) return;
    app.classList.add("out", "revealed");
    hint.textContent = "Make a wish! 🎉";
    const p = flamePos();
    burst(p.x, p.y, 160);
    setTimeout(() => burst(W * .2, H * .35, 70), 250);
    setTimeout(() => burst(W * .8, H * .35, 70), 450);
    setTimeout(() => rain(120), 700);
  }

  cake.addEventListener("click", blowOut);
  cake.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); blowOut(); } });
  document.getElementById("again").addEventListener("click", () => {
    burst(W / 2, H * .4, 140);
    rain(80);
  });

  // Welcome burst on load
  addEventListener("load", () => setTimeout(() => burst(W / 2, H * .3, 90), 400));
</script>
</body>
</html>
